<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Months</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  button { cursor: pointer; border: 1px solid #888; background: #f4f4f4; border-radius: 4px; padding: .3rem .7rem; font-size: 1rem; min-width: 7rem; }
  button:hover { background: #e6e6e6; }
  button:disabled { cursor: default; opacity: .6; }
  .toggle { min-width: 5rem; color: #fff; }
  .toggle.open { background: #16a34a; border-color: #16a34a; }
  .toggle.open:hover { background: #15803d; }
  .toggle.locked { background: #dc2626; border-color: #dc2626; }
  .toggle.locked:hover { background: #b91c1c; }
  .row { display: flex; align-items: center; gap: .75rem; padding: .5rem 0; border-bottom: 1px solid #eee; }
  .mname { flex: 1; font-weight: 600; }
  .stat { width: 9rem; color: #555; font-size: .9rem; text-align: right; }
  .note { color: #666; font-size: .9rem; }
  #status { min-height: 1.2rem; font-size: .9rem; color: #b91c1c; }
  #status.ok { color: #15803d; }
  .topnav { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-bottom: 1rem; font-size: .95rem; }
  .topnav a { color: #2563eb; text-decoration: none; }
  .topnav a:hover { text-decoration: underline; }
  .topnav a[aria-current] { color: #222; font-weight: 600; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="admin.html">Timesheet</a>
  <a href="staff.html">Staff</a>
  <a href="projects.html">Projects</a>
  <a href="months.html" aria-current="page">Months</a>
  <a href="reports.html">Reports</a>
</nav>
<h1>Manage Months</h1>
<p class="note">Switch a month to Locked to stop any hours being added, changed or removed for it. Locked months can still be viewed and reported on. Switch it back to Open to allow corrections.</p>

<div id="status"></div>
<div id="list"></div>

<script>
const BASE = 'https://joneetwkkgrqbxwhunut.supabase.co/rest/v1/';
const KEY = 'sb_publishable_cjj3_AVozweyDGy2qqVP0Q_jMHFmnfk';
const headers = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
let months = []; // [{month: 'YYYY-MM-DD', entries, staff, hours, locked}]

const $ = id => document.getElementById(id);
function say(msg, ok) { $('status').textContent = msg; $('status').className = ok ? 'ok' : ''; }

async function api(path, opts = {}) {
  const res = await fetch(BASE + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const label = m => {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
};

function render() {
  const list = $('list');
  list.innerHTML = '';
  if (!months.length) { list.innerHTML = '<p class="note">No months with data yet.</p>'; return; }
  months.forEach(m => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="mname"></span><span class="stat"></span><button></button>';
    row.querySelector('.mname').textContent = label(m.month);
    row.querySelector('.stat').textContent = m.staff + ' staff, ' + m.hours + ' h';
    const btn = row.querySelector('button');
    btn.textContent = m.locked ? 'Locked' : 'Open';
    btn.className = 'toggle ' + (m.locked ? 'locked' : 'open');
    btn.title = m.locked ? 'Click to switch to Open' : 'Click to switch to Locked';
    btn.onclick = async () => {
      btn.disabled = true;
      const locked = !m.locked;
      try {
        await api('ts_month_locks?on_conflict=month', {
          method: 'POST',
          headers: { Prefer: 'resolution=merge-duplicates' },
          body: JSON.stringify({ month: m.month, locked, locked_at: new Date().toISOString() })
        });
        m.locked = locked;
        say(label(m.month) + (locked ? ' is now locked.' : ' is now unlocked.'), true);
      } catch (e) { say('Update failed: ' + e.message); }
      render();
    };
    list.appendChild(row);
  });
}

(async () => {
  try {
    months = await api('ts_month_summary?select=month,entries,staff,hours,locked&order=month.desc');
    render();
  } catch (e) { say('Load failed: ' + e.message); }
})();
</script>
</body>
</html>
