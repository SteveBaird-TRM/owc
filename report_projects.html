<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Hours Report</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  .pick { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  input[type=month] { font-size: 1rem; padding: .3rem; }
  button { cursor: pointer; border: 1px solid #888; background: #f4f4f4; border-radius: 4px; padding: .3rem .7rem; font-size: 1rem; }
  button:hover { background: #e6e6e6; }
  #status { min-height: 1.2rem; font-size: .9rem; color: #b91c1c; }
  .legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin: .5rem 0 1rem; font-size: .9rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .projrow { display: grid; grid-template-columns: 160px 1fr 70px; gap: .75rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid #eee; }
  .projrow .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .projrow .none { color: #999; font-style: italic; }
  .projrow .tot { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar { position: relative; display: flex; height: 22px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
  .bar::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(var(--step, 5%) - 1px), rgba(0,0,0,.15) calc(var(--step, 5%) - 1px), rgba(0,0,0,.15) var(--step, 5%)); }
  .bar > div { height: 100%; }
  h2 { margin-top: 2rem; font-size: 1.1rem; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: .4rem .6rem; border-bottom: 1px solid #eee; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: #f8fafc; }
  tfoot td { font-weight: 700; border-top: 2px solid #ccc; }
  td.zero { color: #bbb; }
  td.rt, th.rt { font-weight: 700; background: #f8fafc; }
  .topnav { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-bottom: 1rem; font-size: .95rem; }
  .topnav a { color: #2563eb; text-decoration: none; }
  .topnav a:hover { text-decoration: underline; }
  .topnav a[aria-current] { color: #222; font-weight: 600; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="index.html">Timesheet</a>
  <a href="staff.html">Staff</a>
  <a href="projects.html">Projects</a>
  <a href="report.html">Report by staff</a>
  <a href="report_projects.html" aria-current="page">Report by project</a>
</nav>
<h1>Project Hours Report</h1>
<div class="pick">
  <button id="prev" title="Previous month">◀</button>
  <input type="month" id="month">
  <button id="next" title="Next month">▶</button>
  <button id="refresh">Refresh</button>
</div>
<div id="status"></div>
<div class="legend" id="legend"></div>
<div id="bars"></div>
<h2>Hours by project and staff</h2>
<div class="tablewrap"><table id="grid"></table></div>

<script>
const BASE = 'https://joneetwkkgrqbxwhunut.supabase.co/rest/v1/';
const KEY = 'sb_publishable_cjj3_AVozweyDGy2qqVP0Q_jMHFmnfk';
const MAX = 160;
const PALETTE = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#db2777', '#65a30d', '#4f46e5', '#ea580c'];
const headers = { apikey: KEY, Authorization: 'Bearer ' + KEY };

const $ = id => document.getElementById(id);
const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });

async function api(path) {
  const res = await fetch(BASE + path, { headers });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

let staff = [], projects = [];

function shiftMonth(delta) {
  const [y, m] = $('month').value.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  $('month').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  load();
}

async function load() {
  const month = $('month').value;
  if (!month) return;
  try {
    const entries = await api(`ts_entries?select=staff_id,project_id,hours&month=eq.${month}-01`);
    $('status').textContent = '';
    render(entries);
  } catch (e) { $('status').textContent = 'Load failed: ' + e.message; }
}

function render(entries) {
  const colorOf = id => PALETTE[staff.findIndex(s => s.id === id) % PALETTE.length];
  const hours = {}; // project_id -> staff_id -> hours
  for (const e of entries) {
    (hours[e.project_id] ||= {})[e.staff_id] = e.hours;
  }
  const usedStaff = staff.filter(s => entries.some(e => e.staff_id === s.id));
  // show every active project, plus any inactive one that has hours this month
  const shown = projects.filter(p => p.active || hours[p.id]);
  const projTotal = p => Object.values(hours[p.id] || {}).reduce((a, b) => a + b, 0);
  const staffTotal = s => shown.reduce((a, p) => a + ((hours[p.id] || {})[s.id] || 0), 0);
  const grand = shown.reduce((a, p) => a + projTotal(p), 0);

  $('legend').innerHTML = usedStaff.map(s =>
    `<span><i class="sw" style="background:${colorOf(s.id)}"></i>${esc(s.name)}</span>`).join('');

  const scale = Math.max(MAX, ...shown.map(projTotal));
  const bars = $('bars');
  bars.innerHTML = '';
  for (const p of shown) {
    const row = document.createElement('div');
    row.className = 'projrow';
    const has = hours[p.id];
    row.innerHTML = '<div class="name"></div><div class="bar"></div><div class="tot"></div>';
    row.querySelector('.name').textContent = p.name;
    row.querySelector('.name').title = p.name + (p.active ? '' : ' (inactive)');
    row.querySelector('.tot').textContent = projTotal(p) + ' h';
    const bar = row.querySelector('.bar');
    bar.style.setProperty('--step', (8 / scale * 100) + '%');
    if (!has) {
      bar.style.background = 'transparent';
      bar.style.overflow = 'visible';
      bar.innerHTML = '<span class="none">no hours</span>';
    } else {
      for (const s of staff) {
        const h = has[s.id];
        if (!h) continue;
        const seg = document.createElement('div');
        seg.style.width = (h / scale * 100) + '%';
        seg.style.background = colorOf(s.id);
        seg.title = s.name + ': ' + h + ' h';
        bar.appendChild(seg);
      }
    }
    bars.appendChild(row);
  }
  if (!shown.length) bars.innerHTML = '<p>No projects yet.</p>';

  const grid = $('grid');
  if (!usedStaff.length) {
    grid.innerHTML = '<tbody><tr><td>No hours recorded for this month.</td></tr></tbody>';
    return;
  }
  let html = '<thead><tr><th>Project</th>' +
    usedStaff.map(s => `<th>${esc(s.name)}</th>`).join('') + '<th class="rt">Total</th></tr></thead><tbody>';
  for (const p of shown) {
    html += `<tr><td>${esc(p.name)}</td>` + usedStaff.map(s => {
      const h = (hours[p.id] || {})[s.id] || 0;
      return `<td class="${h ? '' : 'zero'}">${h || '–'}</td>`;
    }).join('') + `<td class="rt">${projTotal(p)}</td></tr>`;
  }
  html += '</tbody><tfoot><tr><td>Total</td>' +
    usedStaff.map(s => `<td>${staffTotal(s)}</td>`).join('') + `<td>${grand}</td></tr></tfoot>`;
  grid.innerHTML = html;
}

$('prev').onclick = () => shiftMonth(-1);
$('next').onclick = () => shiftMonth(1);
$('refresh').onclick = load;
$('month').onchange = load;

(async () => {
  const d = new Date();
  $('month').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  try {
    [staff, projects] = await Promise.all([
      api('ts_staff?select=id,name'),
      api('ts_projects?select=id,name,active')
    ]);
    staff.sort(byName);
    projects.sort(byName);
    load();
  } catch (e) { $('status').textContent = 'Load failed: ' + e.message; }
})();
</script>
</body>
</html>
