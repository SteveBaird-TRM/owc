<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  .pick { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  input[type=month], select { font-size: 1rem; padding: .3rem; }
  button { cursor: pointer; border: 1px solid #888; background: #f4f4f4; border-radius: 4px; padding: .3rem .7rem; font-size: 1rem; }
  button:hover { background: #e6e6e6; }
  #status { min-height: 1.2rem; font-size: .9rem; color: #b91c1c; }
  .tabs { display: flex; flex-wrap: wrap; gap: .25rem; border-bottom: 2px solid #ddd; margin-bottom: 1rem; }
  .tabs button { border: 1px solid transparent; border-bottom: none; background: none; border-radius: 4px 4px 0 0; margin-bottom: -2px; color: #2563eb; }
  .tabs button:hover { background: #f1f5f9; }
  .tabs button[aria-selected=true] { border-color: #ddd; border-bottom: 2px solid #fff; background: #fff; color: #222; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin: .5rem 0 1rem; font-size: .9rem; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .row { display: grid; grid-template-columns: 160px 1fr 70px; gap: .75rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid #eee; }
  .row .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .none { color: #999; font-style: italic; }
  .row .tot { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar { position: relative; display: flex; height: 22px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
  .bar::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(var(--step, 5%) - 1px), rgba(0,0,0,.15) calc(var(--step, 5%) - 1px), rgba(0,0,0,.15) var(--step, 5%)); }
  .bar > div { height: 100%; }
  h2 { margin-top: 2rem; font-size: 1.1rem; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: .4rem .6rem; border-bottom: 1px solid #eee; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { background: #f8fafc; }
  tfoot td { font-weight: 700; border-top: 2px solid #ccc; }
  td.zero { color: #bbb; }
  td.rt, th.rt { font-weight: 700; background: #f8fafc; }
  .topnav { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-bottom: 1rem; font-size: .95rem; }
  .topnav a { color: #2563eb; text-decoration: none; }
  .topnav a:hover { text-decoration: underline; }
  .topnav a[aria-current] { color: #222; font-weight: 600; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="admin.html">Timesheet</a>
  <a href="staff.html">Staff</a>
  <a href="projects.html">Projects</a>
  <a href="months.html">Months</a>
  <a href="reports.html" aria-current="page">Reports</a>
</nav>
<h1>Reports</h1>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="pick">
  <button id="prev" title="Previous month">◀</button>
  <input type="month" id="month">
  <button id="next" title="Next month">▶</button>
  <select id="team" title="Filter by team"></select>
  <label><input type="checkbox" id="hidezero"> Hide zero hours</label>
  <button id="refresh">Refresh</button>
  <button id="xlsx" title="Download the month's hours per person per project as an Excel spreadsheet">Download spreadsheet</button>
  <button id="export" title="Download the graph as a standalone HTML file (no staff names, no table)" hidden>Export HTML</button>
</div>
<div id="status"></div>
<div class="legend" id="legend"></div>
<div id="bars"></div>

<!-- xlsx-js-style = SheetJS plus cell formatting (the plain SheetJS build can't write styles) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>
const BASE = 'https://joneetwkkgrqbxwhunut.supabase.co/rest/v1/';
const KEY = 'sb_publishable_cjj3_AVozweyDGy2qqVP0Q_jMHFmnfk';
const MAX = 160;
const PALETTE = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#db2777', '#65a30d', '#4f46e5', '#ea580c'];
const UNASSIGNED = '(Unassigned)';
const headers = { apikey: KEY, Authorization: 'Bearer ' + KEY };

const $ = id => document.getElementById(id);
const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
const sum = a => a.reduce((x, y) => x + y, 0);

async function api(path) {
  const res = await fetch(BASE + path, { headers });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

let staff = [], projects = [], entries = [];
let tab = 'staff';

const TABS = [
  { id: 'staff',   label: 'By staff',         rowHead: 'Staff',         title: 'Hours by staff and project', none: 'nothing submitted' },
  { id: 'project', label: 'By project',       rowHead: 'Project',       title: 'Hours by project and staff', none: 'no hours' },
  { id: 'bu',      label: 'By business unit', rowHead: 'Business Unit', title: 'Hours by business unit and project', none: 'no hours', field: 'business_unit', hidden: true },
  { id: 'cap',     label: 'By finance project',    rowHead: 'Finance Project',    title: 'Hours by finance project and project name', none: 'no hours', field: 'finance_project', hidden: true }
];

// Build the model for a tab: rows (what each bar/line is), cols (the stacked segments), and cell(row, col) => hours
const NO_TEAM = '__none__';
const inTeam = s => { const f = $('team').value; return !f || (f === NO_TEAM ? !(s.team || '').trim() : (s.team || '').trim() === f); };

function model(t) {
  // Team filter: only staff in the chosen team (and their entries) count
  const staff_ = staff.filter(inTeam);
  const ids = new Set(staff_.map(s => s.id));
  const entries_ = entries.filter(e => ids.has(e.staff_id));
  const h = {}; // staff_id -> project_id -> hours
  for (const e of entries_) (h[e.staff_id] ||= {})[e.project_id] = e.hours;
  const projHas = p => entries_.some(e => e.project_id === p.id);

  if (t.id === 'staff') {
    return { rows: staff_.map(s => ({ id: s.id, name: s.name })), cols: projects,
             cell: (r, c) => (h[r.id] || {})[c.id] || 0, colsUsed: projects.filter(projHas) };
  }
  if (t.id === 'project') {
    const rows = projects.filter(p => p.active || projHas(p)).map(p => ({ id: p.id, name: p.name, title: p.name + (p.active ? '' : ' (inactive)') }));
    return { rows, cols: staff, cell: (r, c) => (h[c.id] || {})[r.id] || 0,
             colsUsed: staff_.filter(s => entries_.some(e => e.staff_id === s.id)) };
  }
  // business unit / finance_project: group projects by the field
  const groupOf = p => (p[t.field] || '').trim() || UNASSIGNED;
  const pmap = Object.fromEntries(projects.map(p => [p.id, p]));
  const visible = projects.filter(p => p.active || projHas(p));
  const names = [...new Set(visible.map(groupOf))].sort((a, b) =>
    a === UNASSIGNED ? 1 : b === UNASSIGNED ? -1 : a.localeCompare(b, undefined, { sensitivity: 'base' }));
  const hrs = {}; // group -> project_id -> hours
  for (const e of entries_) {
    const p = pmap[e.project_id];
    if (!p) continue;
    const g = groupOf(p);
    hrs[g] ||= {};
    hrs[g][p.id] = (hrs[g][p.id] || 0) + e.hours;
  }
  return { rows: names.map(n => ({ id: n, name: n })), cols: projects, cell: (r, c) => (hrs[r.id] || {})[c.id] || 0,
           colsUsed: projects.filter(projHas) };
}

function render() {
  const t = TABS.find(x => x.id === tab);
  const m = model(t);
  const colorOf = c => PALETTE[m.cols.indexOf(c) % PALETTE.length];
  const rowTotal = r => sum(m.cols.map(c => m.cell(r, c)));

  $('legend').innerHTML = m.colsUsed.map(c =>
    `<span><i class="sw" style="background:${colorOf(c)}"></i>${esc(c.name)}</span>`).join('');

  const scale = Math.max(MAX, ...m.rows.map(rowTotal));
  const bars = $('bars');
  bars.innerHTML = '';
  const hideZero = $('hidezero').checked;
  let shown = 0;
  for (const r of m.rows) {
    if (hideZero && !rowTotal(r)) continue;
    shown++;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="name"></div><div class="bar"></div><div class="tot"></div>';
    const nm = row.querySelector('.name');
    nm.textContent = r.name;
    nm.title = r.title || r.name;
    const total = rowTotal(r);
    row.querySelector('.tot').textContent = total + ' h';
    const bar = row.querySelector('.bar');
    bar.style.setProperty('--step', (8 / scale * 100) + '%');
    if (!total) {
      bar.style.background = 'transparent';
      bar.style.overflow = 'visible';
      bar.innerHTML = `<span class="none">${t.none}</span>`;
    } else {
      for (const c of m.cols) {
        const hh = m.cell(r, c);
        if (!hh) continue;
        const seg = document.createElement('div');
        seg.style.width = (hh / scale * 100) + '%';
        seg.style.background = colorOf(c);
        seg.title = c.name + ': ' + hh + ' h';
        bar.appendChild(seg);
      }
    }
    bars.appendChild(row);
  }
  if (!shown) bars.innerHTML = '<p>Nothing to show yet.</p>';
}

function drawTabs() {
  $('export').hidden = tab !== 'project';
  $('tabs').innerHTML = '';
  for (const t of TABS) {
    if (t.hidden) continue; // hidden tabs keep their code; remove `hidden: true` in TABS to show them again
    const b = document.createElement('button');
    b.textContent = t.label;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', t.id === tab);
    b.onclick = () => { tab = t.id; history.replaceState(null, '', '#' + tab); drawTabs(); render(); };
    $('tabs').appendChild(b);
  }
}

// Excel download: one row per person (Name, Staff ID, hours per project, Staff hours) and a Project hours total row.
// Uses the selected month and the team filter. Sums are live Excel formulas.
function downloadSpreadsheet() {
  if (typeof XLSX === 'undefined') { $('status').textContent = 'Spreadsheet library did not load (check your internet connection).'; return; }
  const m = model(TABS.find(x => x.id === 'staff'));
  const projs = m.colsUsed;
  const col = i => { let s = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
  const firstP = 2, lastP = 1 + projs.length, totalC = lastP + 1; // zero-based column indexes
  const n = m.rows.length;
  // Optional first row: finance project above each project name (only if any project has one)
  const hasFin = projs.some(p => (p.finance_project || '').trim());
  const o = hasFin ? 1 : 0; // number of rows above the header row
  const aoa = [];
  if (hasFin) aoa.push(['Finance Project', '', ...projs.map(p => (p.finance_project || '').trim()), '']);
  aoa.push(['Name', 'Staff ID', ...projs.map(p => p.name), 'Staff hours']);
  m.rows.forEach((r, i) => {
    const vals = projs.map(p => m.cell(r, p));
    const line = [r.name, r.id, ...vals];
    line.push(projs.length
      ? { t: 'n', v: sum(vals), f: `SUM(${col(firstP)}${i + 2 + o}:${col(lastP)}${i + 2 + o})` }
      : { t: 'n', v: 0 });
    aoa.push(line);
  });
  const colSums = projs.map(p => sum(m.rows.map(r => m.cell(r, p))));
  const foot = ['Project hours', ''];
  projs.forEach((p, j) => foot.push(n ? { t: 'n', v: colSums[j], f: `SUM(${col(firstP + j)}${2 + o}:${col(firstP + j)}${n + 1 + o})` } : { t: 'n', v: 0 }));
  foot.push(n ? { t: 'n', v: sum(colSums), f: `SUM(${col(totalC)}${2 + o}:${col(totalC)}${n + 1 + o})` } : { t: 'n', v: 0 });
  aoa.push(foot);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 28 }, { wch: 10 }, ...projs.map(() => ({ wch: 14 })), { wch: 12 }];
  // Formatting: bold header row; bold grey "Project hours" row; blue "Staff hours" text
  const setStyle = (r, c, s) => {
    const a = XLSX.utils.encode_cell({ r, c });
    (ws[a] ||= { t: 's', v: '' }).s = s;
  };
  for (let c = 0; c <= totalC; c++) {
    if (hasFin) setStyle(0, c, { font: { bold: true, italic: true, color: { rgb: 'FF0000' } } });
    setStyle(o, c, { font: { bold: true } });
    setStyle(n + 1 + o, c, { font: { bold: true }, fill: { patternType: 'solid', fgColor: { rgb: 'D8E8F8' } } });
  }
  const staffFill = { patternType: 'solid', fgColor: { rgb: 'D0D0D0' } };
  setStyle(o, totalC, { font: { bold: true }, fill: staffFill });
  for (let r = 1 + o; r <= n + o; r++) setStyle(r, totalC, { font: { bold: true }, fill: staffFill });
  ws['!freeze'] = { xSplit: 2, ySplit: 1 + o };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Hours');
  XLSX.writeFile(wb, `hours-${$('month').value}.xlsx`);
}

// Standalone HTML of the By project graph: project bars only, no staff names (legend/tooltips) and no table.
function exportProjectHtml() {
  const t = TABS.find(x => x.id === 'project');
  const m = model(t);
  const colorOf = c => PALETTE[m.cols.indexOf(c) % PALETTE.length];
  const rowTotal = r => sum(m.cols.map(c => m.cell(r, c)));
  const scale = Math.max(MAX, ...m.rows.map(rowTotal));
  const month = $('month').value;
  const label = new Date(month + '-01T00:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  const rows = m.rows.filter(r => !$('hidezero').checked || rowTotal(r)).map(r => {
    const total = rowTotal(r);
    const segs = total
      ? m.cols.map(c => {
          const hh = m.cell(r, c);
          return hh ? `<div style="width:${hh / scale * 100}%;background:${colorOf(c)}" title="${hh} h"></div>` : '';
        }).join('')
      : '<span class="none">no hours</span>';
    return `<div class="row"><div class="name" title="${esc(r.title || r.name)}">${esc(r.name)}</div>` +
      `<div class="bar${total ? '' : ' empty'}" style="--step:${8 / scale * 100}%">${segs}</div>` +
      `<div class="tot">${total} h</div></div>`;
  }).join('');

  const doc = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hours by project - ${esc(label)}</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  .row { display: grid; grid-template-columns: 220px 1fr 70px; gap: .75rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid #eee; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .none { color: #999; font-style: italic; }
  .tot { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar { position: relative; display: flex; height: 22px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
  .bar.empty { background: transparent; overflow: visible; }
  .bar:not(.empty)::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(var(--step) - 1px), rgba(0,0,0,.15) calc(var(--step) - 1px), rgba(0,0,0,.15) var(--step)); }
  .bar > div { height: 100%; }
</style>
</head>
<body>
<h1>Hours by project - ${esc(label)}</h1>
${rows || '<p>Nothing to show.</p>'}
</body>
</html>
`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
  a.download = `hours-by-project-${month}.html`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function shiftMonth(delta) {
  const [y, m] = $('month').value.split('-').map(Number);
  if (!y) return;
  const d = new Date(y, m - 1 + delta, 1);
  $('month').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  load();
}

async function load() {
  const month = $('month').value;
  if (!month) return;
  try {
    entries = await api(`ts_entries?select=staff_id,project_id,hours&month=eq.${month}-01`);
    $('status').textContent = '';
    render();
  } catch (e) { $('status').textContent = 'Load failed: ' + e.message; }
}

$('prev').onclick = () => shiftMonth(-1);
$('next').onclick = () => shiftMonth(1);
$('refresh').onclick = load;
$('team').onchange = render;
$('hidezero').onchange = render;

function fillTeams() {
  const cur = $('team').value;
  const teams = [...new Set(staff.map(s => (s.team || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  $('team').innerHTML = '<option value="">All teams</option>' +
    teams.map(x => `<option value="${esc(x).replace(/"/g, '&quot;')}">${esc(x)}</option>`).join('') +
    (staff.some(s => !(s.team || '').trim()) ? `<option value="${NO_TEAM}">(No team)</option>` : '');
  $('team').value = [...$('team').options].some(o => o.value === cur) ? cur : '';
}
$('export').onclick = exportProjectHtml;
$('xlsx').onclick = downloadSpreadsheet;
$('month').onchange = load;

(async () => {
  const h = location.hash.slice(1);
  if (TABS.some(t => t.id === h)) tab = h;
  drawTabs();
  const d = new Date();
  d.setDate(1); // avoid day-overflow (e.g. 31 Mar - 1 month)
  d.setMonth(d.getMonth() - 1); // default to the previous month
  $('month').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  try {
    [staff, projects] = await Promise.all([
      api('ts_staff?select=id,name,team'),
      api('ts_projects?select=id,name,active,business_unit,finance_project')
    ]);
    staff.sort(byName);
    projects.sort(byName);
    fillTeams();
    load();
  } catch (e) { $('status').textContent = 'Load failed: ' + e.message; }
})();
</script>
</body>
</html>
