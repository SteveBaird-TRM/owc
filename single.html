<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Hours</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { margin-bottom: .5rem; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .total { font-size: 1.2rem; font-weight: 600; }
  button { cursor: pointer; border: 1px solid #888; background: #f4f4f4; border-radius: 4px; padding: .3rem .7rem; font-size: 1rem; }
  button:hover { background: #e6e6e6; }
  .add { background: #2563eb; color: #fff; border-color: #2563eb; }
  .add:hover { background: #1d4ed8; }
  .row { display: grid; grid-template-columns: 160px 1fr auto; gap: .75rem; align-items: center; padding: .5rem 0; border-bottom: 1px solid #eee; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { position: relative; height: 22px; background: #e5e7eb; border-radius: 4px; overflow: hidden; cursor: pointer; }
  .bar::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(var(--step, 5%) - 1px), rgba(0,0,0,.15) calc(var(--step, 5%) - 1px), rgba(0,0,0,.15) var(--step, 5%)); }
  .fill { height: 100%; width: 0; transition: width .1s; }
  .sumrow { display: grid; grid-template-columns: 160px 1fr auto; gap: .75rem; align-items: center; padding: .75rem 0; }
  .sumrow .name { font-weight: 700; }
  .sumbar { position: relative; display: flex; height: 22px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
  .sumbar::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(var(--step, 5%) - 1px), rgba(0,0,0,.15) calc(var(--step, 5%) - 1px), rgba(0,0,0,.15) var(--step, 5%)); }
  .sumbar > div { height: 100%; }
  .sumrow .sumlabel { min-width: 3.5rem; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .ctrl { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
  .ctrl span { min-width: 3.5rem; text-align: right; font-variant-numeric: tabular-nums; }
  #status { color: #b91c1c; min-height: 1.2rem; font-size: .9rem; }
</style>
</head>
<body>
<h1>Project Hours</h1>
<div class="top">
  <button class="add" id="addBtn">+ Add project</button>
  <div class="total">Total: <span id="total">0</span> h</div>
</div>
<div id="status"></div>
<div id="list"></div>
<div class="sumrow"><div class="name">All projects</div><div class="sumbar" id="sumbar"></div><div class="sumlabel" id="sumlabel">0 h</div></div>

<script>
const URL_ = 'https://joneetwkkgrqbxwhunut.supabase.co/rest/v1/time_projects';
const KEY = 'sb_publishable_cjj3_AVozweyDGy2qqVP0Q_jMHFmnfk';
const MAX = 160;
const headers = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
const PALETTE = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#db2777', '#65a30d', '#4f46e5', '#ea580c'];
const colorOf = p => PALETTE[projects.indexOf(p) % PALETTE.length];
let projects = [];

const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');

async function api(path, opts = {}) {
  const res = await fetch(URL_ + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

function render() {
  listEl.innerHTML = '';
  for (const p of projects) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="name"></div>
      <div class="bar" title="Click to set hours"><div class="fill" style="width:${p.hours / MAX * 100}%;background:${colorOf(p)}"></div></div>
      <div class="ctrl"><button data-d="-1">−</button><span>${p.hours} h</span><button data-d="1">+</button></div>`;
    row.querySelector('.name').textContent = p.name;
    row.querySelector('.name').title = p.name;
    row.querySelectorAll('button').forEach(b => b.onclick = () => setHours(p, p.hours + +b.dataset.d));
    const bar = row.querySelector('.bar');
    const fill = row.querySelector('.fill');
    const label = row.querySelector('.ctrl span');
    let startHours = null;
    const hoursAt = e => {
      const r = bar.getBoundingClientRect();
      return Math.max(0, Math.min(MAX, Math.round((e.clientX - r.left) / r.width * MAX)));
    };
    const preview = h => {
      p.hours = h;
      fill.style.width = (h / MAX * 100) + '%';
      label.textContent = h + ' h';
      updateTotal();
    };
    bar.style.touchAction = 'none';
    bar.onpointerdown = e => {
      startHours = p.hours;
      bar.setPointerCapture(e.pointerId);
      fill.style.transition = 'none';
      preview(hoursAt(e));
    };
    bar.onpointermove = e => { if (startHours !== null) preview(hoursAt(e)); };
    bar.onpointerup = bar.onpointercancel = e => {
      if (startHours === null) return;
      const old = startHours;
      startHours = null;
      fill.style.transition = '';
      const h = p.hours;
      p.hours = old;
      setHours(p, h);
    };
    listEl.appendChild(row);
  }
  updateTotal();
}

function updateTotal() {
  const total = projects.reduce((s, p) => s + p.hours, 0);
  document.getElementById('total').textContent = total;
  document.getElementById('sumlabel').textContent = total + ' h';
  const scale = Math.max(MAX, total);
  const bar = document.getElementById('sumbar');
  bar.style.setProperty('--step', (8 / scale * 100) + '%');
  bar.innerHTML = '';
  for (const p of projects) {
    if (!p.hours) continue;
    const seg = document.createElement('div');
    seg.style.width = (p.hours / scale * 100) + '%';
    seg.style.background = colorOf(p);
    seg.title = p.name + ': ' + p.hours + ' h';
    bar.appendChild(seg);
  }
}

async function setHours(p, h) {
  h = Math.max(0, Math.min(MAX, h));
  if (h === p.hours) { render(); return; }
  const old = p.hours;
  p.hours = h;
  render();
  try {
    await api('?id=eq.' + p.id, { method: 'PATCH', body: JSON.stringify({ hours: h }) });
    statusEl.textContent = '';
  } catch (e) {
    p.hours = old; render();
    statusEl.textContent = 'Save failed: ' + e.message;
  }
}

document.getElementById('addBtn').onclick = async () => {
  const name = prompt('Project name?');
  if (!name || !name.trim()) return;
  try {
    const [row] = await api('', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ name: name.trim() }) });
    projects.push(row);
    render();
    statusEl.textContent = '';
  } catch (e) { statusEl.textContent = 'Add failed: ' + e.message; }
};

(async () => {
  try {
    projects = await api('?select=*&order=id');
    render();
  } catch (e) { statusEl.textContent = 'Load failed: ' + e.message; }
})();
</script>
</body>
</html>
